<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Moderno</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">

        <!-- Iniciar Sesión -->
        <div class="form-container active" id="login">
            <img src="image.png" alt="Logo" width="50" height="50" class="logo">
            <br>
            <h2>StudNova</h2>

            <form>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Contraseña" required>

                <button type="submit">Entrar</button>
            </form>

            <div class="links">
                <a href="#" onclick="mostrarFormulario('register')">
                    Registrarme
                </a>

                <a href="#" onclick="mostrarFormulario('forgot')">
                    Olvidé mi contraseña
                </a>
            </div>
        </div>

        <!-- Registro -->
        <div class="form-container" id="register">
            <h2>Registrarme</h2>

            <form>
                <input type="text" placeholder="Nombre completo" required>
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Crear contraseña" required>

                <button type="submit">Crear Cuenta</button>
            </form>

            <div class="links">
                <a href="#" onclick="mostrarFormulario('login')">
                    Ya tengo cuenta
                </a>
            </div>
        </div>

        <!-- Recuperar Contraseña -->
        <div class="form-container" id="forgot">
            <h2>Recuperar Contraseña</h2>

            <form>
                <input type="email" placeholder="Correo electrónico" required>

                <button type="submit">
                    Enviar enlace
                </button>
            </form>

            <div class="links">
                <a href="#" onclick="mostrarFormulario('login')">
                    Volver al inicio
                </a>
            </div>
        </div>

    </div>

    <script>
        function mostrarFormulario(id) {
            document.querySelectorAll('.form-container')
                .forEach(form => form.classList.remove('active'));

            document.getElementById(id)
                .classList.add('active');
        }
    </script>

</body>
</html>
